<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload &amp; Map — kvuno</title>
    <link rel="stylesheet" href="/npm/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/css/material.css">
    <script src="/npm/resumablejs/resumable.js"></script>
</head>
<body class="bg-light" data-max-file-size="{{ max_file_size }}">
<div class="container-fluid py-4" style="max-width:720px;">

    <div class="d-flex align-items-center justify-content-between mb-4">
        <h1 class="h4 mb-0">Upload &amp; Map Columns</h1>
        <div class="d-flex gap-3">
            <a href="/ui/jobs" class="text-decoration-none text-primary small">Jobs &rarr;</a>
            <a href="/openapi" class="text-decoration-none text-primary small">API docs &rarr;</a>
        </div>
    </div>

    <div class="card p-4 mb-3">
        <h2 class="card-title">1. Select file</h2>
        <div id="drop-zone">
            <div class="icon">&#128196;</div>
            <div>Drop an <strong>.rds</strong> or <strong>.parquet</strong> file here, or click to browse</div>
            <div class="small text-muted mt-1">Large files are chunked and resume automatically</div>
        </div>
        <input type="file" id="file-input" accept=".rds,.parquet" class="d-none">

        <div id="progress-wrap" class="mt-3 d-none">
            <div id="progress-bar">
                <div id="progress-fill" style="width:0"></div>
            </div>
            <div id="progress-text" class="small text-muted mt-1"></div>
        </div>
        <div id="upload-msg" class="mt-2 small d-none"></div>
    </div>

    <div id="mapping-card" class="card p-4 mb-3 d-none">
        <h2 class="card-title">2. Map columns</h2>
        <p class="small text-muted mb-3">Map each file column to a database column. Unmapped columns are ignored.</p>
        <div id="mapping-rows"></div>
        <button id="process-btn" disabled class="btn btn-primary mt-3">Process file</button>
        <div id="process-msg" class="mt-2 small d-none"></div>
    </div>

</div>

<script src="/static/js/upload.js"></script>
</body>
</html>

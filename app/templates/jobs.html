{% extends "base.html" %}
{% block title %}Jobs — kvuno{% endblock %}

{% block content %}
<div class="d-flex align-items-center justify-content-between mb-3 flex-wrap gap-2">
  <div class="btn-group btn-group-sm" role="group" id="status-tabs">
    <button class="btn btn-outline-secondary active" data-filter="all">All</button>
    <button class="btn btn-outline-success" data-filter="completed">Completed</button>
    <button class="btn btn-outline-primary" data-filter="processing">Processing</button>
    <button class="btn btn-outline-danger" data-filter="error">Failed</button>
  </div>
  <input type="search" id="job-search" class="form-control form-control-sm" style="max-width:260px;" placeholder="Search files…">
</div>

<div id="jobs-body">
  <p class="text-muted">Loading…</p>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/jobs-init.js') }}"></script>
{% endblock %}

[project]
name = "kvuno-api"
version = "1.0.0"
description = """
Flask REST API for processing agricultural RDS files containing crop planting data.
Ingests, deduplicates, and serves optimized sowing date information via a filterable,
paginated API with spatial query support.
"""
authors = [
    { name = "masgeek", email = "barsamms@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "flask (>=3.1.3,<4.0.0)",
    "pyreadr (>=0.5.6,<0.6.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "loguru (>=0.7.3,<0.8.0)",
    "waitress (>=3.0.2,<4.0.0)",
    "gunicorn (>=26.0.0,<27.0.0)",
    "pandas (>=3.0.3,<4.0.0)",
    "flask-sqlalchemy (>=3.1.1,<4.0.0)",
    "flask-limiter (>=4.1.1)",
    "flask-cors (>=6.0.5,<7.0.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "flask-openapi3[elements,rapidoc,rapipdf,redoc,scalar,swagger] (>=4.3.2,<5.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "geoalchemy2 (>=0.20.0,<0.21.0)",
    "alembic (>=1.18.5,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pylint (>=4.0.6,<5.0.0)",
    "sqlacodegen[geoalchemy2] (>=4.0.4,<5.0.0)",
    "pandas-stubs (>=3.0.3,<3.1.0)",
    "ruff (>=0.15.20,<0.16.0)",
    "pytest (>=9,<10)",
    "pytest-env (>=1,<2)"
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
sqlacodegen = { allow-prereleases = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
env = [
    "DB_URL=sqlite:///:memory:",
    "DB_DRIVER=sqlite",
    "DB_NAME=:memory:"
]


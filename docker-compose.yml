services:
  dev:
    container_name: kvuno-dev
    hostname: kvuno-dev
    image: masgeek/kvuno-api:${TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      FLASK_ENV: ${FLASK_ENV:-development}
      FLASK_APP: ${FLASK_APP:-development}
      FLASK_DEBUG: ${FLASK_DEBUG:-1}
      DEBUG_DB: ${DEBUG_DB:-0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DB_DRIVER: ${DB_DRIVER:-postgresql}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_NAME: ${DB_NAME:?DB_NAME is required}
      SORT_JSON: ${SORT_JSON:-0}
      SERVER_HOST: ${SERVER_HOST:-0.0.0.0}
      SERVER_PORT: ${SERVER_PORT:-5000}
      REMOTE_RDS_URLS: ${REMOTE_RDS_URLS:-}
      REMOTE_RDS_TOKEN: ${REMOTE_RDS_TOKEN:-}
      REMOTE_RDS_COOKIES: ${REMOTE_RDS_COOKIES:-}
      REMOTE_RDS_HEADERS: ${REMOTE_RDS_HEADERS:-}
    volumes:
      - ${DATA_DIR:-./data}:/app/static/data
    ports:
      - "5000:5000"

  prod:
    container_name: kvuno-prod
    hostname: kvuno-prod
    image: masgeek/kvuno-api:${PROD_TAG:-production}
    build:
      context: .
      dockerfile: Dockerfile.prod.dockerfile
    environment:
      FLASK_ENV: ${FLASK_ENV:-development}
      FLASK_APP: ${FLASK_APP:-development}
      FLASK_DEBUG: ${FLASK_DEBUG:-1}
      DEBUG_DB: ${DEBUG_DB:-0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DB_DRIVER: ${DB_DRIVER:-postgresql}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_NAME: ${DB_NAME:?DB_NAME is required}
      SORT_JSON: ${SORT_JSON:-0}
      SERVER_HOST: ${SERVER_HOST:-0.0.0.0}
      SERVER_PORT: ${SERVER_PORT:-5000}
      REMOTE_RDS_URLS: ${REMOTE_RDS_URLS:-}
      REMOTE_RDS_TOKEN: ${REMOTE_RDS_TOKEN:-}
      REMOTE_RDS_COOKIES: ${REMOTE_RDS_COOKIES:-}
      REMOTE_RDS_HEADERS: ${REMOTE_RDS_HEADERS:-}
    volumes:
      - ${DATA_DIR:-./data}:/app/static/data
    ports:
      - "5001:5000"
  db:
    container_name: db
    hostname: db
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
